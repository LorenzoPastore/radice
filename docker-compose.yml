services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radice
      POSTGRES_USER: radice
      POSTGRES_PASSWORD: radice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radice -d radice"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env.local
        required: false
    environment:
      SECRET_KEY: django-insecure-local-dev-key-change-in-prod
      DEBUG: "True"
      DATABASE_URL: postgres://radice:radice@postgres:5432/radice
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
      DJANGO_SETTINGS_MODULE: config.settings.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python manage.py runserver 0.0.0.0:8000

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config.celery_app worker -l INFO --concurrency 2
    env_file:
      - path: .env.local
        required: false
    environment:
      SECRET_KEY: django-insecure-local-dev-key-change-in-prod
      DEBUG: "True"
      DATABASE_URL: postgres://radice:radice@postgres:5432/radice
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
      DJANGO_SETTINGS_MODULE: config.settings.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config.celery_app beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - path: .env.local
        required: false
    environment:
      SECRET_KEY: django-insecure-local-dev-key-change-in-prod
      DEBUG: "True"
      DATABASE_URL: postgres://radice:radice@postgres:5432/radice
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
      DJANGO_SETTINGS_MODULE: config.settings.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: pnpm dev

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge
