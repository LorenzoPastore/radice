[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[project]
name = "radice-backend"
version = "0.1.0"
description = "Radice — family memory preservation PWA backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "django-allauth[socialaccount]>=65.0",
    "django-environ>=0.11",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "celery[redis]>=5.3",
    "django-ratelimit>=4.1",
    "sentry-sdk[django]>=2.0",
    "Pillow>=10.0",
    "boto3>=1.34",
    "whitenoise>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "django-extensions>=3.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "django-extensions>=3.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=apps --cov-report=term-missing --cov-fail-under=0"

# ruff config lives in ruff.toml to keep this file clean

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
strict = false

[tool.django-stubs]
django_settings_module = "config.settings.local"
