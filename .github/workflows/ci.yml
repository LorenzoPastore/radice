name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: cd backend && uv pip install --system -e ".[dev]"
      - name: Ruff check
        run: cd backend && ruff check .
      - name: Ruff format check
        run: cd backend && ruff format --check .
      - name: Mypy
        run: cd backend && mypy apps/ --ignore-missing-imports
        continue-on-error: true  # not blocking yet

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: radice_test
          POSTGRES_USER: radice
          POSTGRES_PASSWORD: radice
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: cd backend && uv pip install --system -e ".[dev]"
      - name: Run tests
        run: cd backend && pytest --cov=apps --cov-report=xml -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://radice:radice@localhost:5432/radice_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-ci
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
        continue-on-error: true

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install deps
        run: cd frontend && pnpm install
      - name: Biome check
        run: cd frontend && pnpm lint
      - name: TypeScript check
        run: cd frontend && pnpm type-check

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install deps
        run: cd frontend && pnpm install
      - name: Run tests
        run: cd frontend && pnpm test
